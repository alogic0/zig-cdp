name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux (${{ matrix.optimize }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned Zig version
        id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig-version.outputs.version }}
          cache-key: ${{ matrix.optimize }}

      - name: Verify compiler and browser
        run: |
          test "$(zig version)" = "$(cat .zigversion)"
          google-chrome --version

      - name: Install virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth openbox x11-utils

      - name: Check Zig formatting
        if: matrix.optimize == 'Debug'
        run: zig fmt --check build.zig build.zig.zon src tests examples

      - name: Test library, run example, and build CLI
        run: zig build test check example install -Doptimize=${{ matrix.optimize }} --summary all

      - name: Test CLI sessions with one CPU
        shell: bash
        run: |
          cpu=$(awk '/Cpus_allowed_list/{sub(/[-,].*/, "", $2); print $2}' /proc/self/status)
          taskset --cpu-list "$cpu" zig build test-cli -Doptimize=${{ matrix.optimize }} --summary all

      - name: Test headed browser on Xvfb
        run: zig build test-headed test-focus -Dheaded-window-manager=true -Doptimize=${{ matrix.optimize }} --summary all

      - name: Test package consumer
        shell: bash
        run: |
          package_dir=$(mktemp -d)
          git archive HEAD | tar -x -C "$package_dir"
          export ZIG_GLOBAL_CACHE_DIR="$package_dir/cache"
          cd "$package_dir/tests/package"
          zig build test -Doptimize=${{ matrix.optimize }} --summary all

  test-providers:
    name: ${{ matrix.provider }} (${{ matrix.optimize }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
        provider: [http_fixture, test_support]
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned Zig version
        id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig-version.outputs.version }}
          cache-key: ${{ matrix.provider }}-${{ matrix.optimize }}

      - name: Fetch the provider pinned in the package manifest
        id: provider
        shell: python
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          import os, re, subprocess
          from pathlib import Path

          name = os.environ["PROVIDER"]
          manifest = Path("build.zig.zon").read_text()
          entry = re.search(rf"\.{re.escape(name)}\s*=\s*\.\{{([^}}]*)\}}", manifest)
          if entry is None:
              raise SystemExit(f"Missing dependency {name} in build.zig.zon")
          pin = dict(re.findall(r'\.(url|hash)\s*=\s*"([^"]+)"', entry[1]))
          subprocess.run(["zig", "build", "--fetch=all"], check=True)
          packages = Path(os.environ.get("ZIG_LOCAL_PKG_DIR", "zig-pkg"))
          root = (packages / pin["hash"]).resolve(strict=True)
          if (root / ".zigversion").read_bytes() != Path(".zigversion").read_bytes():
              raise SystemExit(f"Zig version mismatch for {name}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"root={root}", file=output)
              print(f"url={pin['url']}", file=output)

      - name: Test provider and example
        working-directory: ${{ steps.provider.outputs.root }}
        run: zig build test example -Doptimize=${{ matrix.optimize }} --summary all

      - name: Test isolated immutable package consumer
        shell: bash
        env:
          PROVIDER: ${{ matrix.provider }}
          PROVIDER_ROOT: ${{ steps.provider.outputs.root }}
          PROVIDER_URL: ${{ steps.provider.outputs.url }}
        run: |
          consumer_dir=$(mktemp -d)
          cp "$PROVIDER_ROOT/tests/package/"* "$consumer_dir/"
          export ZIG_GLOBAL_CACHE_DIR="$consumer_dir/cache"
          cd "$consumer_dir"
          zig fetch --save="$PROVIDER" "$PROVIDER_URL"
          zig build test -Doptimize=${{ matrix.optimize }} --summary all
