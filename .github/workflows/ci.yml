name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux (${{ matrix.optimize }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned Zig version
        id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig-version.outputs.version }}
          cache-key: ${{ matrix.optimize }}

      - name: Verify compiler and browser
        run: |
          test "$(zig version)" = "$(cat .zigversion)"
          google-chrome --version

      - name: Install virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth openbox

      - name: Check Zig formatting
        if: matrix.optimize == 'Debug'
        run: zig fmt --check build.zig build.zig.zon src tests examples

      - name: Test library, run example, and build CLI
        run: zig build test check example install -Doptimize=${{ matrix.optimize }} --summary all

      - name: Test CLI sessions with one CPU
        shell: bash
        run: |
          cpu=$(awk '/Cpus_allowed_list/{sub(/[-,].*/, "", $2); print $2}' /proc/self/status)
          taskset --cpu-list "$cpu" zig build test-cli -Doptimize=${{ matrix.optimize }} --summary all

      - name: Test headed browser on Xvfb
        run: zig build test-headed -Dheaded-window-manager=true -Doptimize=${{ matrix.optimize }} --summary all

      - name: Test package consumer
        shell: bash
        run: |
          package_dir=$(mktemp -d)
          git archive HEAD | tar -x -C "$package_dir"
          export ZIG_GLOBAL_CACHE_DIR="$package_dir/cache"
          cd "$package_dir/tests/package"
          zig build test -Doptimize=${{ matrix.optimize }} --summary all

  test-providers:
    name: ${{ matrix.provider.name }} (${{ matrix.optimize }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
        provider:
          - name: http_fixture
            archive: vendor/zig-http-fixture-b51873725fecd7936078e64026b6ea664783773e.tar.gz
          - name: test_support
            archive: vendor/zig-test-support-e23cb642765677807c2e80f613fb873f9780554a.tar.gz
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned Zig version
        id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig-version.outputs.version }}
          cache-key: ${{ matrix.provider.name }}-${{ matrix.optimize }}

      - name: Unpack the pinned provider archive
        id: provider
        shell: bash
        run: |
          provider_dir=$(mktemp -d)
          tar -xzf "${{ matrix.provider.archive }}" -C "$provider_dir"
          cmp .zigversion "$provider_dir/.zigversion"
          echo "root=$provider_dir" >> "$GITHUB_OUTPUT"

      - name: Test provider and example
        working-directory: ${{ steps.provider.outputs.root }}
        run: zig build test example -Doptimize=${{ matrix.optimize }} --summary all

      - name: Test isolated immutable package consumer
        shell: bash
        run: |
          consumer_dir=$(mktemp -d)
          cp "${{ matrix.provider.archive }}" "$consumer_dir/provider.tar.gz"
          cp "${{ steps.provider.outputs.root }}/tests/package/"* "$consumer_dir/"
          export ZIG_GLOBAL_CACHE_DIR="$consumer_dir/cache"
          cd "$consumer_dir"
          zig fetch --save=${{ matrix.provider.name }} file:provider.tar.gz
          zig build test -Doptimize=${{ matrix.optimize }} --summary all
