<!doctype html><meta charset=utf-8><title>Native browser workflow</title>
<label>Name <input id=name aria-label=Name></label><button id=save>Save</button><output id=saved></output>
<style>#board{display:flex;gap:100px;margin-top:20px;height:120px}#card,#drop{width:100px;height:80px;background:#ccd;user-select:none}#drop{background:#ded}</style>
<div id=board><div id=card>Card</div><div id=drop>Drop here</div></div><output id=sorted></output>
<input id=files type=file multiple hidden><output id=uploaded></output>
<a id=download href=/download>Download artifact</a>
<script>
document.querySelector('#save').onclick=async()=>{const response=await fetch('/api/save',{method:'POST',body:JSON.stringify({name:document.querySelector('#name').value})});const body=await response.json();document.querySelector('#saved').textContent=body.saved?'Saved '+document.querySelector('#name').value:'Rejected';console.log('save complete',body.id)};
document.querySelector('#files').onchange=async e=>{document.querySelector('#uploaded').textContent=(await Promise.all([...e.target.files].map(f=>f.text()))).join('|')};
let held=false,started=0,moves=0;window.trusted=true;
addEventListener('pointerdown',e=>{held=true;started=performance.now();moves=0;trusted&&=e.isTrusted});
addEventListener('pointermove',e=>{if(held&&e.buttons===1&&performance.now()-started>=100)moves++});
addEventListener('pointerup',e=>{trusted&&=e.isTrusted;if(held&&moves>=3&&e.target.closest('#drop')){document.querySelector('#drop').append(document.querySelector('#card'));document.querySelector('#sorted').textContent='Moved'}held=false});
</script>
